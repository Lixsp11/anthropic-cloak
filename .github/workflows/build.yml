name: Build and Release
on:
  push:
    branches: [main]
    tags: ['[0-9]*', 'v[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Test
        run: go test -timeout 60s ./...
      - name: Vet
        run: go vet ./...
  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    env:
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist package
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          go build -trimpath -ldflags="-s -w" -o "package/anthropic-cloak$suffix" .
          cp README.md LICENSE package/
          name="anthropic-cloak-$GOOS-$GOARCH"
          if [ "$GOOS" = windows ]; then
            archive="$name.zip"
            (cd package && zip -q "../dist/$archive" *)
          else
            archive="$name.tar.gz"
            tar -czf "dist/$archive" -C package .
          fi
          (cd dist && sha256sum "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: anthropic-cloak-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: anthropic-cloak-*
          path: dist
          merge-multiple: true
      - name: Verify packages and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check *.sha256)
          cat dist/*.sha256 > dist/SHA256SUMS
          count=$(find dist -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)
          test "$count" -eq 6
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft --jq .isDraft > existing-release.txt 2>/dev/null; then
            if [ "$(cat existing-release.txt)" = false ]; then
              echo "Release is already published."
              exit 0
            fi
          else
            cat > release-notes.md <<'NOTES'
          Experimental local HTTP/HTTPS proxy for Anthropic client compatibility.

          - Inspect Anthropic API traffic while tunneling other HTTPS destinations unchanged.
          - Filter billing attribution, system client markers, the Claude Code beta value, and Claude CLI User-Agent identification.
          - Normalize incompatible global cache scope while retaining cache boundaries and TTL.
          - Include Linux, Windows, and macOS builds for amd64 and arm64.

          Archives contain the executable, README, and MIT license. Verify downloads using SHA256SUMS.
          Builds are unsigned. Local certificates currently expire after 24 hours.
          Request rewriting can affect cache behavior and does not guarantee compatibility with every conversation.
          NOTES
            gh release create "$tag" --verify-tag --draft --title "Anthropic Cloak $tag" --notes-file release-notes.md
          fi
          gh release upload "$tag" dist/*.zip dist/*.tar.gz dist/SHA256SUMS --clobber
          gh release edit "$tag" --draft=false
